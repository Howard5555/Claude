/* ================= timing: everything follows the narration (timings.json from voice.py) ================= */

const BEAT = {

/* ================= helpers ================= */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ================= renderer ================= */

/* ================= faces: flat 2D drawings on 3D heads ================= */
function faceTexture(kind) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d'); x.lineCap = 'round'; x.strokeStyle = '#1c1626'; x.fillStyle = '#1c1626'; x.lineWidth = 20;
  const eye = (cx, cy) => {
    if (kind === 'happy' || kind === 'laugh') { x.beginPath(); x.arc(cx, cy + 14, 28, Math.PI * 1.15, Math.PI * 1.85); x.stroke(); }
    else if (kind === 'blink') { x.beginPath(); x.moveTo(cx - 22, cy + 4); x.lineTo(cx + 22, cy + 4); x.stroke(); }
    else if (kind === 'shock') { x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, cy, 46, 0, 7); x.fill(); x.lineWidth = 14; x.stroke(); x.fillStyle = '#1c1626'; x.beginPath(); x.arc(cx, cy + 4, 17, 0, 7); x.fill(); x.lineWidth = 20; }
    else { x.beginPath(); x.ellipse(cx, cy, 17, 22, 0, 0, 7); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(cx - 5, cy - 8, 6, 0, 7); x.fill(); x.fillStyle = '#1c1626'; }
  };
  eye(176, 210); eye(336, 210);
  if (kind === 'laugh') { x.fillStyle = '#6a2433'; x.beginPath(); x.arc(256, 316, 74, 0, Math.PI); x.closePath(); x.fill(); x.lineWidth = 16; x.stroke();
    x.fillStyle = '#f07a8a'; x.beginPath(); x.ellipse(256, 362, 34, 18, 0, 0, Math.PI); x.fill(); }
  else if (kind === 'shock') { x.fillStyle = '#6a2433'; x.beginPath(); x.ellipse(256, 350, 34, 46, 0, 0, 7); x.fill(); x.lineWidth = 14; x.stroke(); }
  else if (kind === 'happy') { x.beginPath(); x.arc(256, 292, 62, .15 * Math.PI, .85 * Math.PI); x.stroke(); }
  else { x.beginPath(); x.arc(256, 288, 46, .22 * Math.PI, .78 * Math.PI); x.stroke(); }
  // rosy cheeks
  x.fillStyle = 'rgba(240,120,120,.28)'; x.beginPath(); x.ellipse(130, 290, 34, 20, 0, 0, 7); x.ellipse(382, 290, 34, 20, 0, 0, 7); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const FACES = Object.fromEntries(['neutral', 'happy', 'laugh', 'shock', 'blink'].map(k => [k, faceTexture(k)]));

/* ================= bean characters ================= */
function bean({ body = 0xf6dfc8, shirt = 0x2f6fb3, hat = 0x8a5a2b, scarf = null, blinkSeed = 0 }) {

  head.position.y = 2.55; g.add(head);

  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0), faceMat);
  face.position.set(0, -.02, .6); face.renderOrder = 2; head.add(face);
  const cap = outlined(new THREE.Mesh(new THREE.SphereGeometry(.645, 48, 20, 0, Math.PI * 2, 0, Math.PI / 2.5), toon(hat)), .045);
  cap.position.y = .08; head.add(cap);

  brim.position.set(0, .34, .3); brim.rotation.set(.25, Math.PI / 2, 0); head.add(brim);
  if (scarf) { const s = outlined(new THREE.Mesh(new THREE.TorusGeometry(.42, .13, 14, 32), toon(scarf)), .06); s.rotation.x = Math.PI / 2; s.position.y = 2.0; g.add(s); }

    const foot = new THREE.Mesh(new THREE.SphereGeometry(.1, 12, 8), limbMat); foot.scale.set(1.2, .6, 1.6); foot.position.set(0, -.64, .05); foot.castShadow = true; p.add(foot); g.add(p); return p; });
  const arms = [-1, 1].map(sd => { const p = new THREE.Group(); p.position.set(sd * .55, 1.7, 0); const l = limb(.8); l.position.y = -.4; p.add(l);

  scene.add(g);
  return { g, head, torso, faceMat, legs, arms, blinkSeed, setFace(k) { faceMat.map = FACES[k]; } };
}

}

[[0, 0, 0, 1.6], [1.1, -.3, .2, 1.1], [-1.1, -.25, .1, 1.15], [.2, .9, -.2, 1.1], [0, -.4, 1.0, 1.0]].forEach(([a, b, c, r]) => {

const sprout = new THREE.Group(); sprout.position.copy(PLANT); scene.add(sprout);
{

/* ================= camera: one continuous C1-smooth path (time-based cubic Hermite) ================= */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const camKeys = [
  [0.00,                V(1.5, 2.9, 5.6), V(0.35, 2.05, 0)],   // medium close on hero + coin
  [BEAT.whipA,          V(1.2, 2.8, 4.7), V(0.35, 2.15, 0)],   // slow push-in
  [BEAT.whipB,          V(3.6, 2.6, 8.2), V(0.6, 1.0, 0.3)],   // whip-pan down to the ground
  [P[1].e,              V(3.8, 2.8, 9.0), V(0.2, 1.3, 0.0)],   // planting, mid-wide drift
  [P[2].s + .5,         V(2.2, 5.0, 13.5), V(-2.5, 1.4, -1.0)],// pull back: laughers in frame
  [BEAT.lapseB,         V(2.3, 5.2, 13.9), V(-2.3, 1.4, -0.8)],// near-locked wide: time passes
  [BEAT.tree + .45,     V(3.4, 1.0, 13.0), V(-1.2, 3.2, 0.0)], // low-angle tilt up as tree bursts
  [DURATION,            V(3.9, 0.9, 14.2), V(-1.2, 3.3, 0.0)]  // slow drift on the reveal
];
function hermite(keys, t, idx) {
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const [t0, a] = [keys[i][0], keys[i][idx]], [t1, b] = [keys[i + 1][0], keys[i + 1][idx]];
  const tan = j => {                                    // Catmull-Rom tangent in units/second; zero at ends
    if (j === 0 || j === keys.length - 1) return new THREE.Vector3();
    return keys[j + 1][idx].clone().sub(keys[j - 1][idx]).divideScalar(keys[j + 1][0] - keys[j - 1][0]).multiplyScalar(.85);
  };
  // after the whip-pan, land softly (no overshoot)
  const m0 = (i === 2) ? new THREE.Vector3() : tan(i), m1 = (i + 1 === 2) ? tan(i + 1).multiplyScalar(.3) : tan(i + 1);
  const d = t1 - t0, u = clamp((t - t0) / d), u2 = u * u, u3 = u2 * u;
  return a.clone().multiplyScalar(2 * u3 - 3 * u2 + 1)
    .add(m0.clone().multiplyScalar((u3 - 2 * u2 + u) * d))
    .add(b.clone().multiplyScalar(-2 * u3 + 3 * u2))
    .add(m1.clone().multiplyScalar((u3 - u2) * d));
}
function cameraAt(t) {
  camera.position.copy(hermite(camKeys, t, 1));
  camera.lookAt(hermite(camKeys, t, 2));
}

/* ================= captions ================= */
const CAPTIONS = TIM.captions;
function captionInfo(t) { let c = null; for (const k of CAPTIONS) if (t >= k[0]) c = k; return c; }

/* ================= grade: saturation tells the story ================= */
function gradeAt(t) {
  const G = [[0, 1.08, 1.0], [P[1].e, 1.08, 1.0], [P[2].s + .3, .62, .99], [BEAT.lapseB, .5, .97], [BEAT.tree + .25, 1.3, 1.03], [DURATION, 1.3, 1.03]];
  let i = 0; while (i < G.length - 2 && t > G[i + 1][0]) i++;
  const k = smooth(seg(t, G[i][0], G[i + 1][0]));
  return { sat: lerp(G[i][1], G[i + 1][1], k), bri: lerp(G[i][2], G[i + 1][2], k) };
}

/* ================= animate the world at time t ================= */
const tmpV = new THREE.Vector3();
function setWorld(t) {
  // sun: afternoon, then three fast day cycles during "three days later" (long shadows sweep)
  const sweep = seg(t, BEAT.lapseA, BEAT.lapseB);
  const ang = 0.6 + Math.PI * 2 * 3.5 * smooth(sweep);     // ends on the other side: time has passed
  const day = (Math.cos(Math.PI * 2 * 3 * smooth(sweep)) + 1) / 2;   // 1 = high sun, 0 = low sun
  const lapsing = sweep > 0 && sweep < 1;
  sun.position.set(Math.cos(ang) * 30, lapsing ? lerp(6, 30, day) : 30, Math.sin(ang) * 20 + 18);
  sun.intensity = lapsing ? lerp(1.4, 3.0, day) : 3.0;
  clouds.forEach((c, i) => c.position.x = [-18, 14, 30][i] + t * .6 + (lapsing ? sweep * 12 : sweep >= 1 ? 12 : 0));

  // hero: breathe, hold coin up, crouch to plant, then step aside during the time-lapse
  const breath = Math.sin(t * 4.2) * .025;
  const crouch = smooth(seg(t, BEAT.plantDown, BEAT.plantDown + .3)) * (1 - smooth(seg(t, BEAT.standUp, BEAT.standUp + .3)));
  const aside = smooth(seg(t, BEAT.lapseA, BEAT.lapseA + .6));
  hero.g.position.set(lerp(0, .25, crouch) - aside * 1.3, 0, aside * .4);
  hero.g.rotation.y = lerp(.15, -.55, crouch) + aside * .35;
  hero.torso.position.y = 1.35 + breath - crouch * .45;
  hero.torso.scale.set(1 - breath * .6, 1 + breath, 1 - breath * .6);
  hero.head.position.y = 2.55 + breath * 1.4 - crouch * .55;
  hero.head.rotation.x = crouch * .45;
  hero.legs.forEach(l => l.scale.y = 1 - crouch * .5);
  const raised = 1 - smooth(seg(t, BEAT.whipA - .05, BEAT.whipB));
  hero.arms[1].rotation.z = lerp(.25, 2.5, raised) * (1 - crouch) + crouch * .9;
  hero.arms[1].rotation.x = -crouch * 1.1;
  hero.arms[0].rotation.z = -.25 - Math.sin(t * 4.2) * .05;
  const heroCheer = t > BEAT.tree + .2;
  if (heroCheer) { hero.arms[0].rotation.z = -2.3 + Math.sin(t * 9) * .15; hero.arms[1].rotation.z = 2.3 - Math.sin(t * 9) * .15; }
  hero.setFace(isBlink(t, hero.blinkSeed) ? 'blink' : (t < BEAT.whipB || heroCheer) ? 'happy' : 'neutral');

  // coin: held up and spinning, then pushed into the dirt
  if (t < BEAT.whipB) {
    coin.visible = true;
    tmpV.set(0, -.82, 0); hero.arms[1].localToWorld(tmpV);
    coin.position.copy(tmpV).add(new THREE.Vector3(0, .3, 0));
    coin.rotation.set(Math.PI / 2, 0, 0); coin.rotateZ(0); coin.rotation.y = t * 4;
  } else {
    const k = smooth(seg(t, BEAT.whipB + .08, BEAT.coinIn));
    coin.visible = t < BEAT.coinIn + .05;
    coin.position.set(PLANT.x, lerp(1.0, -.04, k), PLANT.z);
    coin.rotation.set(lerp(Math.PI / 2, 0, k), t * 3 * (1 - k), 0);
  }
  sparkles.forEach((s, i) => {
    const early = t < BEAT.whipA, late = t > BEAT.tree + .15;
    const ph = (t * 1.5 + i / sparkles.length) % 1;
    const base = early ? coin.position : tmpV.set(PLANT.x, 4.0, PLANT.z);
    const rad = early ? .5 : 2.7;
    s.position.set(base.x + Math.cos(i * 1.7 + t) * rad, base.y + Math.sin(i * 2.3 + t * 1.3) * rad * .7, base.z + .35);
    const sc = Math.sin(ph * Math.PI) ** 2 * (early ? .3 : .65) * ((early || late) ? 1 : 0);
    s.scale.set(sc, sc, 1); s.material.rotation = t * 2 + i;
  });

  // dirt pop as the coin goes in
  const pop = seg(t, BEAT.coinIn - .02, BEAT.coinIn + .5);
  dirtBits.forEach((d, i) => {
    const a = i / dirtBits.length * Math.PI * 2 + i * .3, sp = .6 + (i % 3) * .3;
    d.visible = pop > 0 && pop < 1;
    const e = easeOut(pop);
    d.position.set(PLANT.x + Math.cos(a) * e * sp, .04 + Math.sin(pop * Math.PI) * (.5 + (i % 4) * .15), PLANT.z + Math.sin(a) * e * sp);
    d.rotation.set(t * 6 + i, t * 4, 0);
  });

  // laughers: belly-laugh, then jump in shock when the tree appears
  [laughA, laughB].forEach((L, i) => {
    const laughing = t > BEAT.laughA - .05 && t < BEAT.tree + .1;
    const shocked = t >= BEAT.tree + .1;
    L.setFace(isBlink(t, L.blinkSeed) && !laughing && !shocked ? 'blink' : shocked ? 'shock' : laughing ? 'laugh' : 'neutral');
    const amt = laughing ? smooth(seg(t, BEAT.laughA - .05, BEAT.laughA + .15)) : 0;
    const shake = Math.sin(t * 30 + i * 2) * .05 * amt;
    const breath = Math.sin(t * 4 + i) * .02;
    L.torso.position.y = 1.35 + Math.abs(shake) * 2 + breath;
    L.head.position.y = 2.55 + Math.abs(shake) * 2.4 + breath * 1.4;
    L.head.rotation.z = shake * 2.5; L.head.rotation.x = -amt * .2;
    const jump = shocked ? Math.sin(seg(t, BEAT.tree + .1, BEAT.tree + .45) * Math.PI) * .45 : 0;
    L.g.position.y = jump;
    L.arms[0].rotation.z = shocked ? -2.6 : lerp(-.25, -1.0 + shake * 3, amt);
    L.arms[1].rotation.z = shocked ? 2.6 : lerp(.25, .8, amt);
  });

  // sprout grows during the time-lapse; then the tree bursts up with a springy overshoot
  const sp = seg(t, BEAT.lapseA + .1, BEAT.lapseB);
  sprout.visible = t < BEAT.tree + .06 && sp > 0;
  sprout.scale.setScalar(.2 + easeOut(sp) * 1.8);
  const g = seg(t, BEAT.tree, BEAT.tree + .38);
  const spring = g < 1 ? easeOut(g) * (1 + Math.sin(g * Math.PI) * .22)
                       : 1 + Math.sin((t - BEAT.tree - .38) * 10) * Math.exp(-(t - BEAT.tree - .38) * 5) * .05;
  tree.visible = g > 0; tree.scale.set(spring, spring, spring);
  crownG.rotation.z = Math.sin(t * 3) * .015;
  treeCoins.forEach(c => {
    const k = seg(t, BEAT.tree + .2 + c.userData.delay, BEAT.tree + .42 + c.userData.delay);
    c.scale.setScalar(Math.max(.0001, easeOut(k) * (1 + Math.sin(k * Math.PI) * .3)));
    c.quaternion.copy(c.userData.base); c.rotateY(c.userData.spin + t * 2.2);
  });
  fallers.forEach(c => {
    const u = c.userData, dt = t - u.t0;
    c.visible = dt > 0;
    const y = Math.max(.03, u.y0 - 9 * dt * dt);
    c.position.set(u.x, y, u.z);
    c.rotation.set(y > .03 ? t * u.spin : Math.PI / 2, t * 2, 0);
  });
}

/* ================= compositing: motion blur + grade + captions ================= */
const out = document.getElementById('out');
const ctx = out.getContext('2d');
ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
const fontReady = document.fonts.load('900 96px Nunito');

function drawCaption(t) {
  const info = captionInfo(t); if (!info) return;
  const [start, text] = info, age = t - start;
  const big = text === 'MONEY.';
  const pop = 1 + (big ? .3 : .12) * Math.pow(Math.max(0, 1 - age / .14), 2);
  ctx.save();
  ctx.translate(W / 2, H * 0.685); ctx.scale(pop, pop);
  ctx.font = `900 ${big ? 128 : 92}px Nunito`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(20,10,30,.5)'; ctx.shadowOffsetY = 7; ctx.shadowBlur = 14;
  ctx.lineWidth = 15; ctx.strokeStyle = '#1c1626'; ctx.strokeText(text, 0, 0);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = big ? '#ffd43b' : '#ffffff'; ctx.fillText(text, 0, 0);
  ctx.restore();
}

window.renderFrame = async (i) => {
  await fontReady;
  const t = i / FPS;
  const { sat, bri } = gradeAt(t);
  const whip = t > BEAT.whipA - 1 / FPS && t < BEAT.whipB + 1 / FPS;
  const n = whip ? 18 : 4;                         // sub-frames per frame
  const shutter = (whip ? 1.3 : .5) / FPS;         // 180-degree shutter normally, wider on the whip
  ctx.filter = `saturate(${sat}) brightness(${bri})`;
  for (let s = 0; s < n; s++) {
    const ts = clamp(t + (s / (n - 1) - .5) * shutter, 0, DURATION);
    setWorld(ts); cameraAt(ts); renderer.render(scene, camera);
    ctx.globalAlpha = 1 / (s + 1);                 // running average of sub-frames
    ctx.drawImage(glCanvas, 0, 0, W, H);           // also downsamples 1.5x -> clean edges
  }
  ctx.globalAlpha = 1; ctx.filter = 'none';
  const v = ctx.createRadialGradient(W / 2, H * .45, H * .35, W / 2, H * .5, H * .78);
  v.addColorStop(0, 'rgba(40,20,60,0)'); v.addColorStop(1, 'rgba(40,20,60,.16)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  drawCaption(t);
  return out.toDataURL('image/jpeg', 0.95);
};
window.TOTAL_FRAMES = Math.round(DURATION * FPS);
window.sceneReady = true;
</script>
