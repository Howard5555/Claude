/* =====================================================================
   SHOTS - each is a pure function of global time t; camera keys are local
   ===================================================================== */
function hermite(keys, t, idx) {
  if (keys.length === 1) return keys[0][idx].clone();
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const k0 = keys[i], k1 = keys[i + 1];
  const tan = j => (j <= 0 || j >= keys.length - 1) ? new THREE.Vector3() : keys[j + 1][idx].clone().sub(keys[j - 1][idx]).divideScalar(keys[j + 1][0] - keys[j - 1][0]).multiplyScalar(.85);
  const d = k1[0] - k0[0], u = clamp((t - k0[0]) / d), u2 = u * u, u3 = u2 * u;
  return k0[idx].clone().multiplyScalar(2 * u3 - 3 * u2 + 1).add(tan(i).multiplyScalar((u3 - 2 * u2 + u) * d))
    .add(k1[idx].clone().multiplyScalar(-2 * u3 + 3 * u2)).add(tan(i + 1).multiplyScalar((u3 - u2) * d));
}
let camShake = 0;
function setCam(keys, t) {
  const p = hermite(keys, t, 1), l = hermite(keys, t, 2);

}

      c.position.copy(w.g.position).add(V(0, 3.4 + easeOut(u) * 1.6, 0)); c.rotation.set(Math.PI / 2, 0, t * 6); c.scale.setScalar(springIn(seg(t, t0, t0 + .2)) * (1 - seg(u, .8, 1)));
    });
    setCam([[B1, V(15, 14, 20), V(0, 9, -14)], [P[6].e, V(11, 11.5, 12), V(0, 8.5, -14)], [B2, V(10, 11, 11), V(0, 8.5, -14)]], t);
  }},
  /* 3: they pay in cash */
  { a: B2, b: B3, light: 'day', focus: V(36, 2, -2), grade: [1.12, 1.0], run(t) {
    const D = DOCK;
    pose(buyerA, { x: D.x + .5, z: -.1, ry: -1.3, t, face: 'happy', armR: 1.2, armRx: -.8 });
    pose(buyerB, { x: D.x + 1.6, z: -.9, ry: -1.1, t, face: 'happy', armL: -2.4, armR: 2.4 });
    pose(conman, { x: D.x - 1.6, z: .3, ry: 1.2, t, face: t > P[7].s + .6 ? 'happy' : 'sly', armL: -1.0, armLx: -.8, armR: .25 });
    const u = smooth(seg(t, P[7].s, P[7].s + .55));
    bag.visible = true; const from = handOf(buyerA, 1).getWorldPosition(new THREE.Vector3()), to = handOf(conman, 0).getWorldPosition(new THREE.Vector3());
    bag.position.lerpVectors(from, to, u).add(V(0, Math.sin(u * Math.PI) * .6 - .1, 0)); bag.rotation.z = Math.sin(t * 8) * .1 * (1 - u);
    bills.forEach((b, i) => { const t0 = P[7].s + .45 + i * .03, d = t - t0; b.visible = d > 0;
      b.position.copy(bag.position).add(V(Math.cos(i * 2.1) * d * 1.6, .4 + d * 2.6 - d * d * 2.2, Math.sin(i * 1.3) * d * 1.2)); b.rotation.set(t * (3 + i % 3), t * 2 + i, i); });
    setCam([[B2, V(D.x - .6, 2.7, 9.2), V(D.x - .4, 1.8, -.3)], [B3, V(D.x - .5, 2.7, 8.3), V(D.x - .4, 1.9, -.3)]], t);
  }},
  /* 4: next morning - toll booth on the bridge, police drag them away */
  { a: B3, b: B4, light: 'sunrise', focus: V(0, DECK_Y, -8), span: 18, grade: [1.1, 1.0], run(t) {
    const Y = DECK_Y + .4, z0 = -8;
    booth.visible = true; booth.position.set(-2.3, Y, z0 - .4); booth.rotation.y = 0;
    const up = springIn(seg(t, P[8].s + 1.0, P[8].s + 1.4)); booth.scale.set(1, Math.max(.001, up), 1);
    booth.userData.arm.rotation.z = t > P[9].s + .5 ? -1.2 * smooth(seg(t, P[9].s + .5, P[9].s + .8)) : 0;
    const drag = seg(t, P[9].s + .55, P[9].e + .15);
    [buyerA, buyerB].forEach((c, i) => pose(c, { x: lerp(.6 + i * 1.4, 6.5 + i, easeIn(drag)), y: Y, z: z0 + 1.6, ry: drag > 0 ? -Math.PI / 2 : .2 - i * .4, t,
      face: t > P[9].s + .3 ? 'shock' : 'happy', armL: drag > 0 ? -1.6 : -.25, armR: drag > 0 ? 2.6 : (t < P[8].s + 1.0 ? 2.0 : .4), walk: drag > 0 && drag < 1 ? .3 : 0, lean: drag > 0 ? .2 : 0 }));
    const run = seg(t, P[9].s - .1, P[9].s + .55);
    [copA, copB].forEach((c, i) => pose(c, { x: lerp(-7 - i, 0 + i * 1.4, smooth(run)) + (drag > 0 ? lerp(0, 6.6, easeIn(drag)) : 0), y: Y, z: z0 + 2.4, ry: Math.PI / 2, t,
      face: 'neutral', walk: run > 0 && run < 1 || (drag > 0 && drag < 1) ? .45 : 0, armL: -.25, armR: 1.4 }));
    camShake = t > P[9].s + .5 && t < P[9].s + .8 ? .05 : 0;
    setCam([[B3, V(2.8, Y + 3.5, z0 + 12), V(-.5, Y + 2.2, z0)], [P[8].e, V(3.0, Y + 2.7, z0 + 10), V(-.6, Y + 1.8, z0 + .4)], [B4, V(2.6, Y + 3.0, z0 + 11), V(1.8, Y + 1.8, z0 + 1)]], t);
  }},
  /* 5: caught, prison */
  { a: B4, b: B5, light: 'prison', focus: PR.clone().add(V(0, 1, -2)), span: 8, grade: [.62, 1.0], run(t) {
    const shut = springIn(seg(t, P[10].s + .55, P[10].s + .8));
    cellBars.visible = true; cellBars.position.set(PR.x + lerp(5.8, -.25, shut), 0, PR.z + 1.2);
    const sit = smooth(seg(t, P[11].s - .1, P[11].s + .4));
    pose(conman, { x: PR.x + lerp(0, .2, sit), y: lerp(0, .3, sit), z: PR.z + lerp(-1.2, -2.6, sit), ry: 0, t, face: t > P[10].s + .7 ? 'sad' : 'shock', armL: -.2, armR: .2, bob: .6 });
    conman.legs.forEach(l => l.rotation.x = -sit * 1.4);
    camShake = t > P[10].s + .78 && t < P[10].s + 1.0 ? .04 : 0;
    setCam([[B4, V(PR.x + 1.2, 2.6, PR.z + 7.5), V(PR.x, 2.2, PR.z - 1.5)], [P[10].e, V(PR.x + .8, 2.5, PR.z + 6.6), V(PR.x, 2.0, PR.z - 2)],
            [B5, V(PR.x + .3, 2.3, PR.z + 5.2), V(PR.x + .2, 1.9, PR.z - 2.6)]], t);
  }},
  /* 6: the trick lives on - sunset bridge, a new seller winks */
  { a: B5, b: DURATION + 1, light: 'sunset', focus: V(-3, 4, -8), span: 40, grade: [1.2, 1.02], run(t) {
    const S = BRIDGE_FOOT;
    pose(seller2, { x: S.x + .3, z: S.z + .6, ry: -.3, t, face: t > P[13].s + 1.3 ? 'wink' : 'sly', armR: 2.2, armL: t > P[13].s + 1.3 ? -1.2 : -.3 });
    endSign.visible = true; endSign.position.set(S.x + 1.3, 0, S.z + .4); endSign.rotation.y = -.3;
    setCam([[B5, V(-24, 7, 30), V(0, 14, -34)], [P[12].e + .2, V(-15, 3.4, 22), V(-6, 5, 0)],
            [P[13].s + 1.3, V(-10.4, 2.5, 15.0), V(-7.0, 2.5, 7.4)], [DURATION + 1, V(-10.2, 2.5, 14.4), V(-7.0, 2.5, 7.4)]], t);
  }}
];
/* transitions at each shot boundary: whip-pan or dissolve */
const TRANS = [{ type: 'whip', d: .3 }, { type: 'whip', d: .24 }, { type: 'whip', d: .24 }, { type: 'dissolve', d: .32 }, { type: 'dissolve', d: .32 }, { type: 'dissolve', d: .32 }];

function shotIndex(t) { let i = 0; while (i < SHOTS.length - 1 && t >= SHOTS[i].b) i++; return i; }
function renderShot(i, t, yaw = 0) {
  const S = SHOTS[i]; hideAll(); applyLight(S.light, S.focus, S.span || 30);
  S.run(clamp(t, S.a, S.b));
  if (yaw) camera.rotateY(yaw);
  renderer.render(scene, camera);
}

/* =====================================================================
   COMPOSITING
   ===================================================================== */
const out = document.getElementById('out'); const ctx = out.getContext('2d');
ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
const [tmpC, tmpX] = canvas2d(W, H);

function gradeFilter(i) { const [s, b] = SHOTS[i].grade; return `saturate(${s}) brightness(${b})`; }

/* draw one moment (no blur) into a target 2D context */
function drawMoment(target, t) {
  const i = shotIndex(t);
  // transition windows around boundaries
  for (let k = 0; k < TRANS.length; k++) {
    const B = SHOTS[k].b, d = TRANS[k].d;
    if (t > B - d / 2 && t < B + d / 2) {
      const u = (t - (B - d / 2)) / d;
      if (TRANS[k].type === 'whip') {
        if (u < .5) { renderShot(k, B - .001, -easeIn(u * 2) * 1.1); target.filter = gradeFilter(k); }
        else { renderShot(k + 1, B, (1 - easeOut((u - .5) * 2)) * 1.1); target.filter = gradeFilter(k + 1); }
        target.drawImage(glCanvas, 0, 0, W, H); target.filter = 'none'; return;
      } else {
        renderShot(k, t); target.filter = gradeFilter(k); target.globalAlpha = 1; target.drawImage(glCanvas, 0, 0, W, H);
        renderShot(k + 1, t); target.filter = gradeFilter(k + 1); target.globalAlpha = smooth(u); target.drawImage(glCanvas, 0, 0, W, H);
        target.globalAlpha = 1; target.filter = 'none'; return;
      }
    }
  }
  renderShot(i, t); target.filter = gradeFilter(i); target.drawImage(glCanvas, 0, 0, W, H); target.filter = 'none';
}

function captionAt(t) { let c = null; for (const k of TIM.captions) if (t >= k[0]) c = k; return c; }
function drawCaption(t) {
  const info = captionAt(t); if (!info) return;
  const [start, text] = info, age = t - start, big = text === 'CASH.';
  const pop = 1 + (big ? .28 : .12) * Math.pow(Math.max(0, 1 - age / .14), 2);
  ctx.save(); ctx.translate(W / 2, H * .685); ctx.scale(pop, pop);
  ctx.font = `900 ${big ? 124 : 92}px Nunito`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(20,10,30,.5)'; ctx.shadowOffsetY = 7; ctx.shadowBlur = 14;
  ctx.lineWidth = 15; ctx.strokeStyle = '#1c1626'; ctx.strokeText(text, 0, 0);
  ctx.shadowColor = 'transparent'; ctx.fillStyle = big ? '#7be07b' : '#ffffff'; ctx.fillText(text, 0, 0);
  ctx.restore();
}
function inWhip(t) { return TRANS.some((tr, k) => tr.type === 'whip' && Math.abs(t - SHOTS[k].b) < tr.d / 2 + 1 / FPS); }

window.renderFrame = async (f) => {
  const t = f / FPS;
  const whip = inWhip(t);
  const n = whip ? 14 : 3, shutter = (whip ? 1.2 : .5) / FPS;
  for (let s = 0; s < n; s++) {
    const ts = clamp(t + (s / (n - 1) - .5) * shutter, 0, DURATION);
    tmpX.clearRect(0, 0, W, H); drawMoment(tmpX, ts);
    ctx.globalAlpha = 1 / (s + 1); ctx.drawImage(tmpC, 0, 0);
  }
  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W / 2, H * .45, H * .35, W / 2, H * .5, H * .78);
  v.addColorStop(0, 'rgba(40,20,60,0)'); v.addColorStop(1, 'rgba(40,20,60,.16)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  drawCaption(t);
  return out.toDataURL('image/jpeg', 0.95);
};
window.TOTAL_FRAMES = Math.round(DURATION * FPS);
window.sceneReady = true;
</script>
